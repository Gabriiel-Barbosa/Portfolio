<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Projetos | Gabriel Barbosa</title>
<meta name="description" content="Projetos de Gabriel Barbosa em gestão, planejamento, indicadores e resultados.">
<meta name="theme-color" content="#6A35F2">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<script>
  // Aplica o tema antes da pintura para não piscar. O hash #escuro ou #claro força um tema.
  (function () {
    var salvo = null;
    try { salvo = localStorage.getItem("tema"); } catch (e) {}
    var hash = location.hash.slice(1);
    var escuro = hash === "escuro" || (hash !== "claro" && (salvo ? salvo === "escuro" : matchMedia("(prefers-color-scheme: dark)").matches));
    document.documentElement.dataset.theme = escuro ? "dark" : "light";
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>
<header class="barra">
  <div class="miolo">
    <a class="marca" href="index.html">
      Gabriel Barbosa
    </a>
    <nav aria-label="Seções">
      <a href="index.html#experiencia">Experiência</a>
      <a href="projetos.html" aria-current="page">Projetos</a>
      <a href="index.html#ferramentas">Ferramentas</a>
      <a href="#contato">Contato</a>
    </nav>
    <button class="tema" id="tema" type="button" aria-label="Alternar entre modo claro e escuro">
      <svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>

          <fieldset class="opcoes-filtro"></fieldset>
        </details>
        <details class="menu-filtro" id="filtro-tecnologia" name="filtros">

        <details class="menu-filtro" id="filtro-setor" name="filtros">

        <details class="menu-filtro" id="filtro-area" name="filtros">

          <fieldset class="opcoes-filtro"></fieldset>

        <details class="menu-filtro" id="filtro-competencia" name="filtros">
